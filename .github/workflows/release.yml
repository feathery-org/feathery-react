name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type: patch (bug fixes) | minor (new features) | major (breaking changes)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  id-token: write # npm trusted publishing
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Where sign stages the signed SBOM so filing can be retried.
      SBOM_PENDING_ID: feathery-react/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Validate User
        env:
          GITHUB_TOKEN: ${{ secrets.FEATHERY_BOT_TOKEN }}
        run: |
          response=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/orgs/feathery-org/members/$GITHUB_ACTOR")
          if echo "$response" | grep -q '"message": "Not Found"'; then
            echo "$GITHUB_ACTOR is not a member of the organization"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.FEATHERY_BOT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      # npm 12.0.0 is missing the bundled sigstore dependency.
      # https://github.com/npm/cli/issues/9722
      - name: Install npm 11
        run: npm install -g npm@11

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Lint & Test
        run: |
          yarn lint
          yarn test:ci

      - name: Setup Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.FEATHERY_BOT_TOKEN }}
        run: yarn release -- --release-as ${{ inputs.release-type }}

      # A missing secret would otherwise fall back to an empty key and publish a
      # silently watermarked package, so fail the release instead. Presence is
      # tested with -z; never echo the value (substrings are not log-masked).
      - name: Verify Syncfusion license key is present
        env:
          SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
        run: |
          if [ -z "$SYNCFUSION_LICENSE_KEY" ]; then
            echo "::error::SYNCFUSION_LICENSE_KEY is not set - refusing to publish a watermarked build"
            exit 1
          fi

      # Build and pack once, then sign and publish that same tarball, so the
      # release SBOM describes exactly the bytes npm serves. This is the only
      # build in the workflow (publishing a tarball skips prepublishOnly), so
      # the key must be in scope on THIS step for rollup/webpack to bake it
      # into the bundle.
      - name: Build Package
        env:
          SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
        run: |
          yarn build
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"

      # Fails the release before publishing unless the SBOM is signed. The
      # signer role trusts only master, which is where releases run.
      - name: Sign Release SBOM
        run: node scripts/release-sbom/sign.cjs "$RUNNER_TEMP/package" "$RUNNER_TEMP/sbom" --pending-id "$SBOM_PENDING_ID"

      - name: Publish to NPM
        run: npm publish "$RUNNER_TEMP"/package/*.tgz

      - name: Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.FEATHERY_BOT_TOKEN }}
        run: git push --follow-tags origin master

      - name: Get New Tag
        id: get_tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.FEATHERY_BOT_TOKEN }}

      # Last, so a filing failure never strands the published version, its
      # tag or its GitHub release. The signed files are staged under the
      # pending id, so filing can be retried from any machine.
      - name: File Release SBOM
        run: |
          if ! python3 scripts/release-sbom/feathery_sbom.py file --pending-id "$SBOM_PENDING_ID"; then
            echo "::error::Filing the release SBOM failed after the release shipped. Retry with operator AWS credentials: python3 scripts/release-sbom/feathery_sbom.py file --pending-id $SBOM_PENDING_ID"
            exit 1
          fi
