name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type: patch (bug fixes) | minor (new features) | major (breaking changes)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  id-token: write # npm trusted publishing
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate User
        env:
          GITHUB_TOKEN: ${{ secrets.FEATHERY_BOT_TOKEN }}
        run: |
          response=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/orgs/feathery-org/members/$GITHUB_ACTOR")
          if echo "$response" | grep -q '"message": "Not Found"'; then
            echo "$GITHUB_ACTOR is not a member of the organization"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.FEATHERY_BOT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      # npm 12.0.0 is missing the bundled sigstore dependency.
      # https://github.com/npm/cli/issues/9722
      - name: Install npm 11
        run: npm install -g npm@11

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Lint & Test
        run: |
          yarn lint
          yarn test:ci

      - name: Setup Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.FEATHERY_BOT_TOKEN }}
        run: yarn release -- --release-as ${{ inputs.release-type }}

      # A missing secret would otherwise fall back to an empty key and publish a
      # silently watermarked package, so fail the release instead. Presence is
      # tested with -z; never echo the value (substrings are not log-masked).
      - name: Verify Syncfusion license key is present
        env:
          SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
        run: |
          if [ -z "$SYNCFUSION_LICENSE_KEY" ]; then
            echo "::error::SYNCFUSION_LICENSE_KEY is not set - refusing to publish a watermarked build"
            exit 1
          fi

      # The only build in this workflow runs inside `npm publish` via the
      # prepublishOnly hook, so the key must be in scope on THIS step for
      # rollup/webpack to bake it into the bundle.
      - name: Publish to NPM
        env:
          SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
        run: npm publish

      - name: Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.FEATHERY_BOT_TOKEN }}
        run: git push --follow-tags origin master

      - name: Get New Tag
        id: get_tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.FEATHERY_BOT_TOKEN }}