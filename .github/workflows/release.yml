name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type: patch (bug fixes) | minor (new features) | major (breaking changes)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  id-token: write # npm trusted publishing
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_url: ${{ steps.gh_release.outputs.url }}
    steps:
      - name: Validate User
        env:
          GITHUB_TOKEN: ${{ secrets.FEATHERY_BOT_TOKEN }}
        run: |
          response=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/orgs/feathery-org/members/$GITHUB_ACTOR")
          if echo "$response" | grep -q '"message": "Not Found"'; then
            echo "$GITHUB_ACTOR is not a member of the organization"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.FEATHERY_BOT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      # npm 12.0.0 is missing the bundled sigstore dependency.
      # https://github.com/npm/cli/issues/9722
      - name: Install npm 11
        run: npm install -g npm@11

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Lint & Test
        run: |
          yarn lint
          yarn test:ci

      - name: Setup Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.FEATHERY_BOT_TOKEN }}
        run: yarn release -- --release-as ${{ inputs.release-type }}

      - name: Read New Version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # A missing secret would otherwise fall back to an empty key and publish a
      # silently watermarked package, so fail the release instead. Presence is
      # tested with -z; never echo the value (substrings are not log-masked).
      - name: Verify Syncfusion license key is present
        env:
          SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
        run: |
          if [ -z "$SYNCFUSION_LICENSE_KEY" ]; then
            echo "::error::SYNCFUSION_LICENSE_KEY is not set - refusing to publish a watermarked build"
            exit 1
          fi

      # The only build in this workflow runs inside `npm publish` via the
      # prepublishOnly hook, so the key must be in scope on THIS step for
      # rollup/webpack to bake it into the bundle.
      - name: Publish to NPM
        env:
          SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
        run: npm publish

      - name: Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.FEATHERY_BOT_TOKEN }}
        run: git push --follow-tags origin master

      - name: Get New Tag
        id: get_tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Draft GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.FEATHERY_BOT_TOKEN }}

  # Open a "chore: bump @feathery/react to X" PR in each repo that consumes
  # the package. Failures here don't undo the release above; re-run this job
  # (or the whole workflow) and it refreshes the same branch/PR.
  bump-consumers:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: feathery-org/feathery-frontend
            base: master
            node: '20.19.5'
          - repo: feathery-org/hosted-forms-next
            base: main
            node: '20'
    steps:
      - name: Checkout feathery-react scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
          path: sdk

      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.base }}
          token: ${{ secrets.FEATHERY_BOT_TOKEN }}
          path: consumer

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'
          cache-dependency-path: consumer/yarn.lock

      - name: Setup Git
        working-directory: consumer
        run: |
          git config user.name "feathery-bot"
          git config user.email "feathery-bot@users.noreply.github.com"

      - name: Open bump PR
        working-directory: consumer
        env:
          GH_TOKEN: ${{ secrets.FEATHERY_BOT_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          REPO: ${{ matrix.repo }}
          BASE_BRANCH: ${{ matrix.base }}
          RELEASE_URL: ${{ needs.release.outputs.release_url }}
        run: ../sdk/.github/scripts/open-consumer-bump-pr.sh
