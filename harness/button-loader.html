<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Button loader size harness</title>
    <style>
      body {
        font: 14px/1.5 -apple-system, system-ui, sans-serif;
        margin: 32px;
        background: #fff;
        color: #101828;
      }
      .case { margin-bottom: 24px; }
      .case-label {
        font-size: 12px;
        color: #475467;
        margin-bottom: 6px;
        font-family: ui-monospace, Menlo, monospace;
      }
      /* A fit-width grid cell. `width: max-content` and not `inline-flex`:
         the button carries `flex: 1` (flex-basis 0%), so inside a bare
         shrink-to-fit flex container it collapses to min-content and wraps the
         label one character per line - which a real grid cell never does. */
      .cell {
        display: flex;
        width: max-content;
        outline: 1px dashed #f04438;
      }
    </style>
  </head>
  <body>
    <h2>Button loader size</h2>
    <p>
      The red dashed outline is a shrink-to-fit cell. Run
      <code>measure()</code> in the console for rects.
    </p>
    <div id="root"></div>
    <script>
      window.__err = null;
      window.addEventListener('error', function (e) {
        if (!window.__err)
          window.__err = (e.error && e.error.stack) || e.message;
      });
    </script>
    <script src="button-loader/bundle.js"></script>
  </body>
</html>
